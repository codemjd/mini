name: Validate Godot Mentor

on:
  push:
    branches:
      - godot-beginner
    paths:
      - "project.godot"
      - "addons/**"
      - "lessons/**"
      - "patches/**"
      - "docs/**"
      - ".github/workflows/validate-godot.yml"
  pull_request:
    paths:
      - "project.godot"
      - "addons/**"
      - "lessons/**"
      - "patches/**"
      - ".github/workflows/validate-godot.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Validate Android Arabic resources
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          path = "patches/godot-4.7.2/platform/android/java/editor/src/main/res/values-ar/strings.xml"
          root = ET.parse(path).getroot()
          assert root.tag == "resources"
          names = [item.attrib["name"] for item in root.findall("string")]
          assert len(names) == len(set(names)), "Duplicate Android resource names"
          print(f"Validated {len(names)} translated Android resource strings.")
          PY

      - name: Validate interactive lesson catalog
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          source = Path("addons/godot_mentor/mentor_dock.gd").read_text(encoding="utf-8")
          numbers = [int(value) for value in re.findall(r'"title": "(\d+) —', source)]
          assert numbers == list(range(1, 21)), f"Expected ordered lessons 1..20, got {numbers}"
          assert "_lesson_picker.item_selected.connect(_on_lesson_selected)" in source
          assert "func _create_practice_scene()" in source
          assert "func _save_progress()" in source
          assert "func _on_answer_selected(answer_index: int)" in source
          print(f"Validated {len(numbers)} interactive lessons and core practice/progress controls.")
          PY

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o godot.zip
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.7.2-stable_linux.x86_64

      - name: Parse project and load editor plugin
        run: |
          godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --editor --path . --quit
