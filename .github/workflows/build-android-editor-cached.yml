name: Build Godot Mentor Android Editor (cached cloud build)

on:
  push:
    branches:
      - cloud-build-cache
    paths:
      - ".github/workflows/build-android-editor-cached.yml"
      - "patches/godot-4.7.2/**"
      - "addons/godot_mentor/**"
      - "project.godot"
      - "README.md"
      - "docs/LESSON_CURRICULUM.md"
  workflow_dispatch:

concurrency:
  group: godot-mentor-android-cached-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout mentor project
        uses: actions/checkout@v4

      - name: Checkout pinned Godot source
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: 4.7.2-stable
          path: godot-source
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install pinned Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;29.0.14206865"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Install SCons
        run: python -m pip install "scons>=4.4,<5"

      - name: Restore SCons object cache
        uses: actions/cache@v4
        with:
          path: .scons_cache
          key: godot-4.7.2-android-editor-arm64-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            godot-4.7.2-android-editor-arm64-${{ runner.os }}-

      - name: Install Godot Android Swappy frame-pacing libraries
        working-directory: godot-source
        run: python misc/scripts/install_swappy_android.py

      - name: Apply Arabic Android editor resources
        shell: bash
        run: |
          set -euo pipefail
          target="godot-source/platform/android/java/editor/src/main/res/values-ar"
          mkdir -p "$target"
          cp patches/godot-4.7.2/platform/android/java/editor/src/main/res/values-ar/strings.xml "$target/strings.xml"
          python -c "import xml.etree.ElementTree as ET; ET.parse('$target/strings.xml')"

      - name: Apply Android Arabic-first editor patch
        run: python patches/godot-4.7.2/native/apply_android_arabic_default.py godot-source/editor/settings/editor_settings.cpp

      - name: Apply Godot Mentor Android application branding
        run: python patches/godot-4.7.2/native/apply_android_editor_branding.py godot-source/platform/android/java/editor/build.gradle

      - name: Package Godot Mentor starter project
        run: |
          zip -r godot-mentor-project-4.7.2.zip \
            project.godot addons/godot_mentor \
            docs/LESSON_CURRICULUM.md docs/ANDROID_STRATEGY.md README.md

      - name: Upload Godot Mentor project bundle
        uses: actions/upload-artifact@v4
        with:
          name: godot-mentor-project-4.7.2
          path: godot-mentor-project-4.7.2.zip
          retention-days: 14

      - name: Build ARM64 Godot Android Editor (cached SCons)
        id: build
        working-directory: godot-source
        shell: bash
        run: |
          set -o pipefail
          scons platform=android arch=arm64 production=yes target=editor generate_android_binaries=yes swappy=yes -j2 cache_path="$GITHUB_WORKSPACE/.scons_cache" redirect_build_objects=no 2>&1 | tee "$GITHUB_WORKSPACE/godot-android-scons.log"

      - name: Upload Godot Android SCons build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-mentor-scons-build-log
          path: godot-android-scons.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Godot Mentor Editor APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: godot-mentor-editor-arm64-4.7.2-arabic-cached
          path: godot-source/bin/android_editor_builds/*.apk
          if-no-files-found: error
          retention-days: 14
