name: Explainer Animora CI

on:
  push:
    branches:
      - stage-0/explainer-animora-foundation
    paths:
      - "explainer/animora/**"
      - ".github/workflows/explainer-animora-ci.yml"
  pull_request:
    paths:
      - "explainer/animora/**"
      - ".github/workflows/explainer-animora-ci.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: explainer/animora
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: explainer/animora/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Mobile regression check — pass 1
        run: npm run test:mobile
      - name: Mobile regression check — pass 2
        run: npm run test:mobile
      - name: Typecheck and build — pass 1
        run: npm run build
      - name: Typecheck and build — pass 2
        run: npm run build
