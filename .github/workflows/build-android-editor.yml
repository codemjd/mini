name: Build Godot Mentor Android Editor

on:
  push:
    branches:
      - godot-beginner
    paths:
      - "patches/godot-4.7.2/**"
      - ".github/workflows/build-android-editor.yml"
  workflow_dispatch:

concurrency:
  group: godot-mentor-android-editor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout mentor project
        uses: actions/checkout@v4

      - name: Checkout pinned Godot source
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: 4.7.2-stable
          path: godot-source
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;29.0.14206865"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Install SCons
        run: python -m pip install "scons>=4.4,<5"

      - name: Apply Arabic Android editor resources
        shell: bash
        run: |
          set -euo pipefail
          target="godot-source/platform/android/java/editor/src/main/res/values-ar"
          mkdir -p "$target"
          cp patches/godot-4.7.2/platform/android/java/editor/src/main/res/values-ar/strings.xml "$target/strings.xml"
          python -c "import xml.etree.ElementTree as ET; ET.parse('$target/strings.xml')"

      - name: Build ARM64 Godot Android Editor with Arabic resources
        working-directory: godot-source
        run: |
          scons platform=android arch=arm64 production=yes target=editor generate_android_binaries=yes -j2

      - name: Upload Godot Mentor Editor APK
        uses: actions/upload-artifact@v4
        with:
          name: godot-mentor-editor-arm64-4.7.2-arabic-resources
          path: godot-source/bin/android_editor_builds/*.apk
          if-no-files-found: error
          retention-days: 14
