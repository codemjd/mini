name: Render and inspect an Explainer Studio MP4 with real Arabic narration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/video/**"
      - "scripts/create-audio-fixture.mjs"
      - "scripts/generate-voice-smoke.mjs"
      - "src/core/**"
      - "src/App.tsx"
      - "src/types/project.ts"
      - "vendor/nabra-tts/**"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/render-smoke.yml"

permissions:
  contents: read

concurrency:
  group: render-smoke-audio-v3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    name: Render and inspect a 24.6-second Arabic narrated demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run project validation tests
        run: npm test

      - name: Type-check and build the app
        run: npm run build

      - name: Render MP4 with Remotion
        run: |
          mkdir -p out
          npm run render:demo

      - name: Inspect the rendered MP4
        run: |
          test -s out/explainer-demo.mp4
          node --input-type=module -e '
            import fs from "node:fs";
            import { createRequire } from "node:module";
            import { execFileSync } from "node:child_process";
            const require = createRequire(import.meta.url);
            const ffprobe = require("ffprobe-static").path;
            const raw = execFileSync(ffprobe, [
              "-v", "error",
              "-show_entries", "stream=codec_type,codec_name,width,height,r_frame_rate,sample_rate,channels",
              "-show_entries", "format=duration,size",
              "-of", "json", "out/explainer-demo.mp4"
            ], { encoding: "utf8" });
            fs.writeFileSync("out/metadata.json", raw);
            const metadata = JSON.parse(raw);
            const video = metadata.streams?.find((stream) => stream.codec_type === "video");
            const audio = metadata.streams?.find((stream) => stream.codec_type === "audio");
            const duration = Number(metadata.format?.duration);
            if (!video) throw new Error("No video stream found");
            if (!audio) throw new Error("No AAC audio stream found");
            if (audio.codec_name !== "aac") throw new Error("Unexpected audio codec: " + audio.codec_name);
            if (video.width !== 1920 || video.height !== 1080) throw new Error("Unexpected video dimensions");
            if (!(duration >= 24 && duration <= 25.2)) throw new Error("Unexpected video duration: " + duration);
            if (!video.codec_name || video.codec_name !== "h264") throw new Error("Unexpected video codec: " + video.codec_name);
            console.log("Verified MP4:", { videoCodec: video.codec_name, audioCodec: audio.codec_name, sampleRate: audio.sample_rate, channels: audio.channels, width: video.width, height: video.height, fps: video.r_frame_rate, duration });
          '

      - name: Verify the AAC stream contains audible signal
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import { createRequire } from "node:module";
            import { spawnSync } from "node:child_process";
            const require = createRequire(import.meta.url);
            const ffmpeg = require("ffmpeg-static");
            if (!ffmpeg || !fs.existsSync(ffmpeg)) throw new Error("Pinned static FFmpeg binary is unavailable");

            const args = ["-hide_banner", "-i", "out/explainer-demo.mp4", "-map", "0:a:0", "-af", "volumedetect", "-f", "null", "/dev/null"];
            const result = spawnSync(ffmpeg, args, { encoding: "utf8", stdio: ["ignore", "pipe", "pipe"] });
            if (result.error) throw result.error;
            if (result.status !== 0) throw new Error(result.stderr || ("FFmpeg exited with status " + result.status));

            const combined = [result.stdout, result.stderr].join("\\n");
            fs.writeFileSync("out/audio-levels.txt", combined);
            const match = combined.match(/max_volume:\\s*(-?[0-9.]+) dB/);
            if (!match) throw new Error("Could not measure the rendered AAC audio signal");
            const maximum = Number(match[1]);
            if (!Number.isFinite(maximum) || maximum <= -75) throw new Error("The rendered AAC stream is silent or too quiet: " + maximum + " dB");
            console.log("Verified non-silent audio in rendered MP4. max_volume:", maximum, "dB");
          '

      - name: Upload rendered MP4 for diagnostic review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explainer-studio-diagnostic-mp4
          path: |
            out/explainer-demo.mp4
            out/metadata.json
            out/audio-levels.txt
          retention-days: 2

      - name: Upload verified demo MP4
        uses: actions/upload-artifact@v4
        with:
          name: explainer-studio-demo-mp4
          path: |
            out/explainer-demo.mp4
            out/metadata.json
            out/audio-levels.txt
          retention-days: 2
